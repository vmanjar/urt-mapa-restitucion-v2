<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colombia | Restitución de Tierras</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas id="webgl-canvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer">
      <!-- Back Button -->
      <button id="btn-back" class="hidden">← Volver al mapa</button>

      <!-- Centered Title & Illustration Banner Container -->
      <div id="location-card">
        <div id="location-banner" class="hidden">
          <div class="banner-placeholder">ILUSTRACIÓN DE LA TERRITORIAL</div>
        </div>
        <h1 id="location-title"></h1>
      </div>

      <!-- Scroll Prompt Cue -->
      <div id="scroll-prompt" class="hidden">
        <span>Desliza para explorar</span>
        <div class="scroll-arrow">↓</div>
      </div>
    </div>

    <!-- Custom Butterfly Cursor -->
    <div id="custom-cursor">
      <img src="/butterfly.png" alt="cursor" />
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
